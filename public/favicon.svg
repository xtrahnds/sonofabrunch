<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#181514"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E8D2"/>
      <stop offset="50%" stop-color="#C9A35E"/>
      <stop offset="100%" stop-color="#8B1E2D"/>
    </linearGradient>
  </defs>

  <!-- Dark Noir Luxury Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Crimson Outer Subtle Ring -->
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#8B1E2D" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Oval Crimson Emblem Frame -->
  <ellipse cx="256" cy="256" rx="170" ry="220" fill="none" stroke="#8B1E2D" stroke-width="4"/>
  <ellipse cx="256" cy="256" rx="160" ry="210" fill="none" stroke="#C9A35E" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Top / Bottom Accent Crosshair Notches -->
  <line x1="256" y1="30" x2="256" y2="50" stroke="#8B1E2D" stroke-width="3"/>
  <line x1="256" y1="462" x2="256" y2="482" stroke="#8B1E2D" stroke-width="3"/>

  <!-- Typography: Monogram "SB" in luxury Cormorant Garamond Serif -->
  <text x="256" y="275" 
        font-family="'Cormorant Garamond', 'Times New Roman', serif" 
        font-size="200" 
        font-weight="700" 
        letter-spacing="10" 
        fill="url(#goldText)" 
        text-anchor="middle"
        dominant-baseline="central">SB</text>

  <!-- Divider Line -->
  <line x1="180" y1="355" x2="332" y2="355" stroke="#8B1E2D" stroke-width="3"/>
</svg>
